server:
  servlet:
    context-path: /api

spring:
  application:
    name: Vulpes-Test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS vulpes
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

jwt:
  secret: test-secret-for-integration-tests-only

logging:
  level:
    io.github.vulpes: DEBUG
    org.springframework.web: DEBUG

# Disable security in tests to allow unauthenticated MockMvc requests
security:
  disabled: true

cors:
  allowed-origins: "*"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: false
