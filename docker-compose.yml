version: "3.9"

services:
  vulpes-api:
    image: vulpes-api:latest
    env_file:
      - .env   # caminho do seu arquivo de variáveis
    ports:
      - "8080:8080"  # ajuste conforme sua API expõe
    restart: unless-stopped

  vulpes-web:
    image: vulpes-web:latest
    ports:
      - "3000:3000"    # React build servido pelo nginx costuma sair na porta 80
    restart: unless-stopped
    depends_on:
      - vulpes-api
