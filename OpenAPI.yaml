  /usuarios/{id}/perfis:
    put:
      tags:
      - Usuários
      summary: Atualizar perfis do usuário
      operationId: atualizarPerfis
      parameters:
      - name: id
        in: path
        description: ID do usuário
        required: true
        schema:
          type: integer
