            '*/*':
              schema:
                $ref: '#/components/schemas/Plataforma'
        "404":
          description: Plataforma não encontrada
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer-key: []
    put:
      tags:
      - Plataformas
      summary: Atualizar plataforma
      description: Atualiza dados de uma plataforma existente
      operationId: atualizarPlataforma
      parameters:
      - name: id
        in: path
        description: ID da plataforma
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plataforma'
        required: true
      responses:
        "404":
          description: Plataforma não encontrada
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "201":
          description: Plataforma atualizada
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Plataforma'
      security:
      - bearer-key: []
    delete:
      tags:
      - Plataformas
      summary: Excluir plataforma
      description: Remove uma plataforma pelo ID
      operationId: excluirPlataforma
      parameters:
      - name: id
        in: path
        description: ID da plataforma
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "404":
          description: Plataforma não encontrada
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "204":
          description: Plataforma excluída
      security:
      - bearer-key: []
  /pagamentos/{id}:
    get:
      tags:
      - Pagamentos
      summary: Consultar pagamento
      description: Recupera um pagamento pelo ID
      operationId: consultarPagamento
      parameters:
      - name: id
        in: path
        description: ID do pagamento
        required: true
        schema:
          type: integer
          format: int64
        example: 10
      responses:
        "200":
          description: Pagamento encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Pagamento'
        "404":
          description: Pagamento não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer-key: []
    put:
      tags:
      - Pagamentos
      summary: Atualizar pagamento
      description: Atualiza um pagamento existente
      operationId: atualizarPagamento
      parameters:
      - name: id
        in: path
        description: ID do pagamento
        required: true
        schema:
          type: integer
          format: int64
        example: 10
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pagamento'
        required: true
      responses:
        "201":
          description: Pagamento atualizado
          content:
