      security:
      - bearer-key: []
  /assinantes/{id}/associar-plataformas:
    post:
      tags:
      - Assinantes
      summary: Associar plataformas
      description: Associa múltiplas plataformas a um assinante
      operationId: associarPlataformas
      parameters:
      - name: id
        in: path
        description: ID do assinante
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssociarPlataformasRequest'
        required: true
      responses:
        "200":
          description: Associação realizada
          content:
            '*/*':
              schema:
                type: object
        "404":
          description: Assinante/Plataforma não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Erro de validação de negócio
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer-key: []
  /pagamentos/assinante/{id}:
    get:
      tags:
      - Pagamentos
      summary: Listar pagamentos por assinante
      description: Retorna lista paginada de pagamentos de um assinante
      operationId: listarPagamentosAssinante
      parameters:
      - name: id
        in: path
        description: ID do assinante
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: pagina
        in: query
        description: Número da página (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
        example: 0
      - name: quantidade
        in: query
        description: Quantidade por página
        required: false
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 10
        example: 10
      responses:
        "404":
          description: Assinante não encontrado
          content:
            '*/*':
