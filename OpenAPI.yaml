            schema:
              $ref: '#/components/schemas/Assinante'
        required: true
      responses:
        "201":
          description: Assinante criado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Assinante'
        "400":
          description: Dados inválidos
          content:
            '*/*':
