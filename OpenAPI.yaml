openapi: 3.0.1
info:
  title: API Vulpes
  description: ""
  contact:
    name: Kaique de Miranda
    email: kbdemiranda@hotmail.com
servers:
- url: http://127.0.0.1:8080/api
  description: Generated server url
tags:
- name: Pagamentos
  description: APIs para gerenciamento de pagamentos
- name: Autenticação
  description: APIs para autenticação de usuários
- name: Plataformas
  description: APIs para gerenciamento de plataformas
- name: Assinantes
  description: APIs para gerenciamento de assinantes
- name: Usuários
  description: APIs para gerenciamento de usuários
paths:
  /usuarios/{id}:
    get:
      tags:
      - Usuários
      summary: Buscar usuário por ID
      operationId: buscarUsuarioPorId
      parameters:
      - name: id
        in: path
        description: ID do usuário
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "404":
          description: Usuário não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "200":
          description: Usuário encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Usuario'
      security:
      - bearer-key: []
    put:
      tags:
      - Usuários
      summary: Atualizar usuário
      operationId: atualizarUsuario
      parameters:
      - name: id
        in: path
        description: ID do usuário
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
        required: true
      responses:
        "404":
          description: Usuário não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "201":
          description: Usuário atualizado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Usuario'
      security:
      - bearer-key: []
    delete:
      tags:
      - Usuários
      summary: Excluir usuário
      operationId: excluirUsuario
      parameters:
      - name: id
        in: path
        description: ID do usuário
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "404":
          description: Usuário não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "204":
          description: Usuário excluído
      security:
      - bearer-key: []
  /usuarios/{id}/senha:
    put:
      tags:
      - Usuários
      summary: Atualizar senha do usuário
      operationId: atualizarSenha
      parameters:
      - name: id
        in: path
        description: ID do usuário
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
