          content:
            '*/*':
              schema:
                type: object
      security:
      - bearer-key: []
  /assinantes/{assinanteId}/desassociar-plataforma/{plataformaId}:
    delete:
      tags:
      - Assinantes
      summary: Desassociar plataforma
      description: Remove a associação de uma plataforma de um assinante
      operationId: desassociarPlataforma
      parameters:
      - name: assinanteId
        in: path
        description: ID do assinante
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: plataformaId
        in: path
        description: ID da plataforma
        required: true
        schema:
          type: integer
          format: int64
        example: 2
      responses:
        "200":
          description: Desassociação realizada
          content:
            '*/*':
              schema:
                type: object
        "404":
          description: Assinante/Plataforma não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Erro de validação de negócio
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer-key: []
components:
  schemas:
    Usuario:
      required:
      - email
      - nome
      - perfis_id
      - senha
      - sobrenome
      type: object
      properties:
        id:
          type: integer
          description: Identificador do usuário
          format: int64
          example: 42
        nome:
          type: string
          description: Nome
          example: Kaique
        sobrenome:
          type: string
          description: Sobrenome
          example: Miranda
        email:
          type: string
          description: Email
          example: kaique@example.com
        senha:
          type: string
          description: Senha do usuário
          writeOnly: true
          example: S3nh@Segura
        perfis_id:
          type: array
          description: IDs dos perfis do usuário
          example:
          - 1
          - 2
          items:
            type: integer
            description: IDs dos perfis do usuário
            format: int64
      description: Dados de um usuário do sistema
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          description: Data/hora do erro (UTC)
          format: date-time
        status:
          type: integer
          description: Código HTTP do erro
          format: int32
          example: 404
        error:
          type: string
          description: Tipo de erro
          example: VulpesException
        message:
          type: string
          description: Mensagem explicativa do erro
          example: Plataforma não encontrada
        path:
          type: string
          description: Caminho da requisição
          example: /plataformas/999
      description: Estrutura padronizada de erros da API
    Plataforma:
      required:
      - nome
      - preco
      - tipo_servico
      - total_vagas
      type: object
      properties:
        id:
          type: integer
          description: Identificador da plataforma
          format: int64
          example: 1
        nome:
          maxLength: 255
          minLength: 3
          type: string
          description: Nome da plataforma
          example: Netflix
        preco:
          minimum: 0.0
          exclusiveMinimum: true
          type: number
          description: Preço mensal
          example: 29.9
        url:
          type: string
          description: URL oficial
          example: https://netflix.com
        tipo_servico:
          type: string
          description: Tipo de serviço de uma plataforma
          example: STREAMING_VIDEO
          enum:
          - STREAMING_VIDEO
          - STREAMING_MUSICA
          - SOFTWARE
          - JOGOS
          - NOTICIAS
          - CLOUD_STORAGE
          - FITNESS
        total_vagas:
          minimum: 1
          type: integer
          description: Total de vagas
          format: int32
          example: 5
        vagas_disponiveis:
          type: integer
          description: Vagas disponíveis
          format: int32
          example: 5
        cadastrado_em:
          type: string
          description: Data de criação
          format: date-time
        atualizado_em:
          type: string
          description: Data de atualização
          format: date-time
        excluido_em:
          type: string
          description: Data de exclusão (soft delete)
          format: date-time
      description: Dados de uma plataforma de serviço
    Pagamento:
      required:
      - assinante_id
      - data_pagamento
      - meses_cobertos
      - valor_pago
      type: object
      properties:
        id:
          type: integer
          description: Identificador do pagamento
          format: int64
          example: 10
        assinante_id:
          type: integer
          description: ID do assinante
          format: int64
          example: 1
        valor_pago:
          minimum: 0.01
          exclusiveMinimum: false
          type: number
          description: Valor pago
          example: 59.8
        meses_cobertos:
          minimum: 1
          type: integer
          description: Quantidade de meses cobertos
          format: int32
          example: 2
        meses:
          type: array
          description: Meses de referência
          example:
          - 2024-07
          - 2024-08
          items:
            type: string
            description: Meses de referência
            example: "[\"2024-07\",\"2024-08\"]"
        data_pagamento:
          type: string
          description: Data do pagamento
          format: date-time
        cadastrado_em:
          type: string
          description: Data de criação
          format: date-time
        atualizado_em:
          type: string
          description: Data de atualização
          format: date-time
        excluido_em:
          type: string
          description: Data de exclusão (soft delete)
          format: date-time
      description: Dados de um pagamento
    Assinante:
      required:
      - email
      - nome
      type: object
      properties:
        id:
          type: integer
          description: Identificador do assinante
          format: int64
          example: 1
        nome:
          type: string
          description: Nome do assinante
          example: João Silva
        email:
          type: string
          description: Email do assinante
          example: joao@email.com
        plataformas_associadas:
          type: array
          description: Plataformas associadas ao assinante
          items:
            $ref: '#/components/schemas/PlataformaResumo'
        valor_por_mes:
          type: number
          description: Custo mensal estimado
          example: 29.9
        cadastrado_em:
          type: string
          description: Data de criação
          format: date-time
        atualizado_em:
          type: string
          description: Data de atualização
          format: date-time
        excluido_em:
          type: string
          description: Data de exclusão (soft delete)
          format: date-time
      description: Dados de um assinante
    PlataformaResumo:
      type: object
      properties:
        id:
          type: integer
          description: ID da plataforma
          format: int64
          example: 1
        nome:
          type: string
          description: Nome da plataforma
          example: Netflix
        precoMensal:
          type: number
          description: Preço mensal total
          example: 29.9
        precoIndividual:
          type: number
          description: Preço individual por assinante
          example: 9.97
      description: Resumo de plataforma associada ao assinante
    LoginRequest:
      required:
      - email
      - senha
      type: object
      properties:
        email:
          type: string
          description: Email do usuário
          example: user@example.com
        senha:
          type: string
          description: Senha do usuário
          writeOnly: true
          example: S3nh@F0rte
      description: Credenciais para autenticação
    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      description: Resposta de autenticação com JWT
    AssociarPlataformasRequest:
      type: object
      properties:
        plataformaIds:
          type: array
          description: IDs das plataformas
          example:
          - 1
          - 2
          - 3
          items:
            type: integer
            description: IDs das plataformas
            format: int64
      description: Requisição para associar plataformas a um assinante
  securitySchemes:
    bearer-key:
      type: http
      scheme: bearer
      bearerFormat: JWT
