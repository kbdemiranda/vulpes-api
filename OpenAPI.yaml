                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer-key: []
  /plataformas:
    get:
      tags:
      - Plataformas
      summary: Listar plataformas
      description: "Retorna lista paginada de plataformas, com filtro opcional por\
        \ nome"
      operationId: listarPlataformas
      parameters:
      - name: nome
        in: query
        description: Filtro por nome
        required: false
        schema:
          type: string
        example: Netflix
      - name: pagina
        in: query
        description: Número da página (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
        example: 0
      - name: quantidade
        in: query
        description: Quantidade por página
        required: false
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 10
        example: 10
      responses:
        "500":
          description: Erro interno
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "200":
          description: Lista retornada com sucesso
          content:
            application/json: {}
        "401":
          description: Não autorizado
      security:
      - bearer-key: []
    post:
      tags:
      - Plataformas
      summary: Cadastrar plataforma
      description: Cria uma nova plataforma
      operationId: cadastrarPlataforma
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plataforma'
        required: true
      responses:
        "201":
          description: Plataforma criada
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Plataforma'
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer-key: []
  /pagamentos:
    get:
      tags:
      - Pagamentos
      summary: Listar pagamentos
      description: "Retorna lista paginada de pagamentos, com filtro opcional por\
        \ nome do assinante"
      operationId: listarPagamentos
      parameters:
      - name: nomeAssinante
        in: query
        description: Filtro por nome do assinante
        required: false
        schema:
          type: string
        example: João
      - name: pagina
        in: query
        description: Número da página (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
        example: 0
      - name: quantidade
        in: query
        description: Quantidade por página
        required: false
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 10
        example: 10
      responses:
        "500":
          description: Erro interno
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "200":
          description: Lista retornada com sucesso
          content:
            '*/*':
              schema:
                type: object
        "401":
          description: Não autorizado
      security:
      - bearer-key: []
    post:
      tags:
      - Pagamentos
      summary: Registrar pagamento
      description: Cria um novo pagamento
      operationId: registrarPagamento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pagamento'
        required: true
      responses:
        "201":
          description: Pagamento criado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Pagamento'
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer-key: []
  /auth/logout:
    post:
      tags:
      - Autenticação
      summary: Logout
      description: Finaliza a sessão do usuário atual
      operationId: logout
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /auth/login:
    post:
      tags:
      - Autenticação
      summary: Login
      description: Autentica o usuário e retorna um token JWT
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "401":
          description: Credenciais inválidas
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "200":
          description: Autenticado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /assinantes:
    get:
      tags:
      - Assinantes
      summary: Listar assinantes
      description: "Retorna lista paginada de assinantes, com filtro opcional por\
        \ nome"
      operationId: listarAssinantes
      parameters:
      - name: nome
        in: query
        description: Filtro por nome
        required: false
        schema:
          type: string
        example: João
      - name: pagina
        in: query
        description: Número da página (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
        example: 0
      - name: quantidade
        in: query
        description: Quantidade por página
        required: false
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 10
        example: 10
      responses:
        "500":
          description: Erro interno
          content:
            '*/*':
