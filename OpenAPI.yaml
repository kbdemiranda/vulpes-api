          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assinante'
        required: true
      responses:
        "201":
          description: Assinante atualizado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Assinante'
        "404":
          description: Assinante não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer-key: []
    delete:
      tags:
      - Assinantes
      summary: Excluir assinante
      description: Remove um assinante pelo ID
      operationId: excluirAssinante
      parameters:
      - name: id
        in: path
        description: ID do assinante
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "404":
          description: Assinante não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "204":
          description: Assinante excluído
      security:
      - bearer-key: []
  /usuarios:
    get:
      tags:
      - Usuários
      summary: Buscar usuário por email
      operationId: buscarUsuarioPorEmail
      parameters:
      - name: email
        in: query
        description: Email do usuário
        required: true
        schema:
          type: string
        example: user@example.com
      responses:
        "404":
          description: Usuário não encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "200":
          description: Usuário encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Usuario'
      security:
      - bearer-key: []
    post:
      tags:
      - Usuários
      summary: Cadastrar usuário
      description: Cria um novo usuário
      operationId: cadastrarUsuario
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
        required: true
      responses:
        "201":
          description: Usuário criado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Usuario'
        "400":
          description: Dados inválidos
          content:
